[project]
name = "comfy-workflow-vault-studio"
version = "1.9.1+studio.1"
description = "Studio (multi-user) fork of Workflow Vault: one shared workflow library on network storage for every artist, with shared permissions, cross-machine locking, a shared trash, authorship, and admin roles."
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Pillow",
    "imageio-ffmpeg",
]

[project.urls]
Repository = "https://github.com/mpileri/ComfyUI_Workflow_Vault_Studio"
Original = "https://github.com/avillabon/ComfyUI_Workflow_Vault"

[tool.comfy]
# PublisherId is the @handle from your registry.comfy.org profile (public — NOT
# the API key): https://registry.comfy.org/publishers/avillabon
PublisherId = "avillabon"
DisplayName = "Workflow Vault Studio"
